# golangci-lint config (CF-72), schema v2. The default linter set is a hard gate
# in CI. Kept intentionally close to the defaults so it stays low-noise and stable.
version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  # v2 dropped `issues.exclude-use-default`; these presets are the same set of
  # built-in exclusions v1 applied by default (deferred Close, naming nits…).
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      # node_modules ships a Go sample inside a JS package (flatted). CI never
      # sees it — nothing runs npm install there — but a local run does, and its
      # findings are noise we can't fix, which is how real ones get ignored.
      - node_modules

issues:
  # Don't cap the report — we keep the tree clean rather than hiding findings.
  max-issues-per-linter: 0
  max-same-issues: 0
