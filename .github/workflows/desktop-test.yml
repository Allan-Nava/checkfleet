name: Desktop tests

# Tests for the desktop app, kept separate from the CLI's ci.yml (which runs
# `go test ./...` at the root and never touches the desktop module). Runs only
# when the desktop app changes.
on:
  push:
    branches: ["main", "master"]
    paths: ["desktop/**", ".github/workflows/desktop-test.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop-test.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Unit tests for the Go bindings (app.go): config loading, running checks,
  # stack discovery, exports — the glue between the GUI and internal/*.
  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Wails prerequisites
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Test bindings
        working-directory: desktop
        run: |
          go mod tidy
          go test -tags webkit2_41 -v ./...

  # Lint the static frontend assets (CF-97). The smoke test only proves the DOM
  # renders — a broken stylesheet or a malformed SVG would slip through it. This
  # gate validates the sources directly:
  #   - stylelint (recommended)   → real CSS errors (dup selectors, bad values…);
  #                                 no-descending-specificity is off (pure noise).
  #   - html-validate (recommended) → malformed markup, dup ids, bad nesting/refs.
  #     doctype-style / no-implicit-button-type are opinionated (off); no-inline-style
  #     is off because Wails REQUIRES inline `--wails-draggable` on the drag regions.
  #   - node --check → main.js syntax; xmllint → SVG well-formedness.
  # Configs live in desktop/frontend/{.stylelintrc.json,.htmlvalidate.json}.
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install linters (pinned)
        run: npm install --no-save --no-audit --no-fund stylelint@16.26.1 stylelint-config-recommended@14.0.1 html-validate@9.7.1
      - name: stylelint (CSS)
        run: npx stylelint --config desktop/frontend/.stylelintrc.json "desktop/frontend/dist/**/*.css"
      - name: html-validate (HTML)
        run: npx html-validate --config desktop/frontend/.htmlvalidate.json desktop/frontend/dist/index.html
      - name: JS syntax (node --check)
        run: |
          for f in desktop/frontend/dist/*.js; do
            echo "checking $f"; node --check "$f"
          done
      # The headless unit tests for the pure frontend modules (acks, notes,
      # audit, charts, presets, runbook). They existed since CF-112 and nothing
      # ran them: `node --check` only parses main.js, so 48 assertions on the
      # mute/note/action-log logic were never executed by CI — the same
      # tests-that-do-not-count trap CF-157 found on the Go side.
      # Invoked as a glob from inside the directory: `node --test <dir>` stopped
      # resolving a directory in Node 22+ and fails with MODULE_NOT_FOUND.
      - name: Frontend unit tests (node --test)
        working-directory: desktop/frontend
        run: node --test *.test.js
      # xmllint is no longer preinstalled on the GitHub-hosted Ubuntu images.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: SVG well-formed (xmllint)
        run: |
          for f in desktop/frontend/dist/assets/*.svg; do
            echo "checking $f"; xmllint --noout "$f"
          done

  # Smoke test the frontend: load it headless (mock backend) and assert the UI
  # actually renders the fleet view — summary + findings table — then capture a
  # preview PNG uploaded as the "frontend-preview" artifact (CF-97).
  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Render and assert
        shell: bash
        run: |
          CHROME='${{ steps.chrome.outputs.chrome-path }}'
          "$CHROME" --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=5000 --dump-dom \
            "file://$PWD/desktop/frontend/dist/index.html" > dom.html

          fail() { echo "::error::$1"; echo '--- rendered DOM (head) ---'; head -c 4000 dom.html; exit 1; }
          grep -q 'worst status'        dom.html || fail "summary not rendered"
          grep -q 'worstLabel">ERROR'   dom.html || fail "worst status not computed"
          grep -q 'badge ERROR'         dom.html || fail "status badges not rendered"
          grep -q 'cell-check">stream'  dom.html || fail "findings table not populated"
          grep -q 'live.example.com'    dom.html || fail "finding target not rendered"
          echo "frontend smoke test OK — fleet view renders"

      # Capture a preview PNG of the same render (mock data) so every run ships a
      # visual of the frontend — download the "frontend-preview" artifact.
      - name: Render preview screenshot
        shell: bash
        run: |
          CHROME='${{ steps.chrome.outputs.chrome-path }}'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --force-device-scale-factor=2 --window-size=1280,860 \
            --virtual-time-budget=6000 --screenshot=frontend-preview.png \
            "file://$PWD/desktop/frontend/dist/index.html"
          ls -la frontend-preview.png
          {
            echo "### Frontend preview"
            echo "Rendered headless from \`desktop/frontend/dist/index.html\` with mock data."
            echo "Download the **frontend-preview** artifact below for the full image."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-preview
          path: frontend-preview.png
          if-no-files-found: warn

  # End-to-end: build the real Wails binary, launch it headless under Xvfb with
  # a seeded config + auto-run, and assert the actual native webview creates a
  # window and renders (non-blank). Exercises embed + Wails runtime + bindings.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            xvfb xdotool imagemagick
      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build the app
        working-directory: desktop
        run: |
          go mod tidy
          wails build -tags webkit2_41 -platform linux/amd64 -ldflags "-X main.version=e2e"
      - name: Launch under Xvfb and assert it renders
        run: |
          set -x
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
          sleep 2
          # Software rendering so webkit works without a GPU.
          export GDK_BACKEND=x11
          export LIBGL_ALWAYS_SOFTWARE=1
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          # WebKitGTK ≥2.42 (shipped by libwebkit2gtk-4.1 on Ubuntu 24.04)
          # defaults to the DMABUF renderer, which paints a blank/black frame
          # under Xvfb's software GL — the window maps but renders nothing.
          # Disabling it makes the webview paint via the software path.
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          # A reachable TCP target for the tcp check, then open the app on it.
          python3 -m http.server 9999 >/tmp/listener.log 2>&1 &
          printf 'timeout_seconds: 5\nchecks:\n  tcp:\n    targets:\n      - address: "127.0.0.1:9999"\n' > "$PWD/checkfleet.yml"
          export CHECKFLEET_CONFIG="$PWD/checkfleet.yml"
          export CHECKFLEET_AUTORUN=1
          ./desktop/build/bin/checkfleet-desktop >/tmp/app.log 2>&1 &
          APP=$!
          ok=""
          for i in $(seq 1 30); do
            if ! kill -0 "$APP" 2>/dev/null; then echo "::error::app exited early"; cat /tmp/app.log; exit 1; fi
            if xdotool search --name checkfleet >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { echo "::error::app window never appeared"; cat /tmp/app.log; exit 1; }
          # WebKit paint timing varies; poll the screenshot until it's non-blank
          # instead of betting on a single fixed sleep.
          colors=0
          for i in $(seq 1 20); do
            import -window root e2e.png >/dev/null 2>&1 || true
            colors=$(identify -format '%k' e2e.png 2>/dev/null || echo 0)
            echo "attempt $i: unique colors = $colors"
            [ "${colors:-0}" -gt 20 ] && break
            sleep 1
          done
          kill "$APP" 2>/dev/null || true
          [ "${colors:-0}" -gt 20 ] || { echo "::error::window looks blank ($colors colors)"; echo '--- app.log ---'; cat /tmp/app.log; exit 1; }
          echo "E2E OK: the packaged app launched and rendered a non-blank window ($colors colors)"
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-screenshot
          path: e2e.png
          if-no-files-found: ignore
