name: Brew test

# Verifies that `brew install Allan-Nava/tap/checkfleet` actually works end to
# end on macOS — after every Release (so the freshly-pushed cask is exercised),
# on demand, and weekly (catches a tap that rots, e.g. a deleted release asset).
#
# Casks are macOS-only, so this runs on both Apple Silicon and Intel to cover
# both branches of the generated cask.
#
# The Intel leg is `macos-15-intel`, NOT `macos-13`: that image was retired on
# 2025-12-04, and a job asking for a label with no runners behind it does not
# fail — it sits **queued forever**. That is what happened here (CF-159): the
# arm64 leg passed in minutes while the Intel leg stayed queued for 13-21 hours,
# so the workflow never concluded and in practice never verified anything. A
# green-looking tap that nobody had actually installed is worse than no check.
#
# `macos-15-intel` is GitHub's last x86_64 macOS image, available until August
# 2027; after that the Intel branch of the cask has to be verified by hand.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to expect, without the leading v (e.g. 0.32.1); empty = whatever releases/latest says"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  brew-install:
    # For the Release trigger: only when the release succeeded, and NOT for a prerelease.
    # `skip_upload: "auto"` deliberately publishes no cask for a v*-rc.* tag (CF-160), so a run
    # here would install the previous stable cask and report success for a release it never saw —
    # a green that verified nothing, which is the failure mode this whole workflow exists to avoid.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           !contains(github.event.workflow_run.head_branch, '-')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel] # arm64, intel
    runs-on: ${{ matrix.os }}
    # A guard, not an optimisation: the install is a few minutes, so anything
    # near this means it is hanging (an interactive prompt, a stalled download)
    # and the run should say so instead of looking busy.
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      # Homebrew 6+ asks to "trust" third-party taps interactively; disable that
      # gate so a headless install doesn't hang/fail.
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - name: Install from the tap
        run: brew install --cask Allan-Nava/tap/checkfleet

      - name: It runs and reports a real version
        run: |
          set -euo pipefail
          which checkfleet
          out="$(checkfleet version)"
          echo "$out"
          # Must not be the local 'dev' string — a release cask carries a real version.
          echo "$out" | grep -Eq '^checkfleet [0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "::error::unexpected version output: $out"; exit 1; }

      # ⚠️ The check that actually matters. Asserting "some X.Y.Z" only proves brew installed
      # *something*: if the cask on the tap is stale (the classic case is the expired PAT that
      # makes goreleaser's last step fail), the old version installs cleanly and this job goes
      # green while `brew install` hands users a release from months ago. Comparing against
      # `releases/latest` is the only signal that catches it — and because it does not depend on
      # the trigger, the Monday cron catches drift that appeared without any release at all.
      - name: The tap serves the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          # An explicit dispatch input wins, so a specific version can still be pinned by hand.
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$WANT" ]; then
            # `gh release view` with no tag resolves /releases/latest, which excludes drafts and
            # prereleases — exactly the release the cask is supposed to track.
            WANT="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
            WANT="${WANT#v}"
          fi
          GOT="$(checkfleet version | awk '{print $2}')"
          echo "tap serves $GOT, latest release is $WANT"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::the tap is stale: installed $GOT but the latest release is $WANT — the cask was not pushed (check HOMEBREW_TAP_GITHUB_TOKEN upstream)"
            exit 1
          fi

      - name: Gatekeeper quarantine attribute is stripped
        run: |
          set -euo pipefail
          bin="$(readlink -f "$(which checkfleet)")"
          if xattr -l "$bin" 2>/dev/null | grep -qi com.apple.quarantine; then
            echo "::error::$bin still has com.apple.quarantine — postflight hook failed"
            exit 1
          fi
          echo "no quarantine attribute ✅"

      - name: Smoke — the binary actually executes a check
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cf.yml" <<'YAML'
          checks:
            tcp:
              targets:
                - {name: github, address: github.com:443, tls: true}
          YAML
          # Exit code is 0 even on WARN/BAD (only systemic errors are non-zero),
          # so this just proves the module runs; --exit-on-bad is intentionally
          # NOT used here.
          checkfleet check tcp --config "$RUNNER_TEMP/cf.yml" --output markdown

      - name: Uninstall
        if: always()
        run: brew uninstall --cask checkfleet || true
