name: CI

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - name: Test with coverage (CF-73)
        run: |
          go test -coverprofile=cover.out ./...
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover.out | tail -1
      - run: go build ./...
      - name: English output guardrail (M15/CF-60)
        run: ./scripts/check-english.sh

  # Quality & security gate (CF-57, CF-72). Both are hard gates now: govulncheck
  # fails only on vulnerabilities the code actually reaches (kept clean by staying
  # on `stable` Go), and golangci-lint fails on any finding (the tree is clean;
  # config in .golangci.yml).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: govulncheck (gate)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: golangci-lint (gate)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

# Releases (cross-platform archives, checksums, Homebrew formula) are built by
# .github/workflows/release.yml with goreleaser on v* tags.
