name: CI

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - name: Test with coverage (CF-73)
        run: |
          go test -coverprofile=cover.out ./...
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover.out | tail -1
      - run: go build ./...
      - name: English output guardrail (M15/CF-60)
        run: ./scripts/check-english.sh
      # Anti-divergence gate for the agent skill (CF-152). The references under
      # skills/checkfleet/references/ are generated from the registry and the
      # config structs; regenerating must be a no-op. Without this, a new module
      # can land while the skill still lists the old set — the trap that left the
      # intro of docs/modules.md at 18 modules while the registry had 29.
      - name: Skill references are up to date (CF-152)
        run: |
          go run ./cmd/gen-skill
          if ! git diff --quiet -- skills/ docs/permissions.md; then
            echo "::error::skills/ or docs/permissions.md is stale — run 'go run ./cmd/gen-skill' and commit the result"
            git diff -- skills/ docs/permissions.md
            exit 1
          fi
      # Same gate for the per-module docs pages (CF-147): they are a projection
      # of docs/modules.md, so editing one by hand must not survive.
      - name: Module pages are up to date (CF-147)
        run: |
          go run ./cmd/gen-docs
          if ! git diff --quiet -- docs/modules; then
            echo "::error::docs/modules is stale — run 'go run ./cmd/gen-docs' and commit the result"
            git diff -- docs/modules
            exit 1
          fi

  # Quality & security gate (CF-57, CF-72). Both are hard gates: govulncheck
  # fails only on vulnerabilities the code actually reaches, and golangci-lint
  # fails on any finding (config in .golangci.yml, schema v2).
  #
  # The two jobs pin Go differently on purpose.
  #
  # govulncheck wants the newest toolchain, because the vulnerability database is
  # keyed on it — `stable` is right there.
  #
  # golangci-lint must analyse the Go version the project actually targets. The
  # action installs a PREBUILT linter binary, and a binary built with Go 1.25
  # cannot typecheck a 1.27 standard library: with `stable` this job died on
  # `could not import math/rand/v2 (method must have no type parameters)` the day
  # Go 1.27 became stable — a failure with nothing to do with this repo's code.
  # Pinning to the go.mod version removes the moving target; `stable` would break
  # this again at every Go release, and it did.
  #
  # Building the linter from source hides the problem rather than fixing it: a
  # locally-compiled v2.12.2 (built with 1.27.1) passes happily, which is exactly
  # why this was green on a laptop and red in CI.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: govulncheck (gate)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      # Re-pin to the go.mod version before linting — see the note above.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: golangci-lint (gate)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

# Releases (cross-platform archives, checksums, Homebrew formula) are built by
# .github/workflows/release.yml with goreleaser on v* tags.
