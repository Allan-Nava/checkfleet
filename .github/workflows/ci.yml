name: CI

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - name: Test with coverage (CF-73)
        run: |
          go test -coverprofile=cover.out ./...
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover.out | tail -1
      - run: go build ./...
      - name: English output guardrail (M15/CF-60)
        run: ./scripts/check-english.sh
      # Anti-divergence gate for the agent skill (CF-152). The references under
      # skills/checkfleet/references/ are generated from the registry and the
      # config structs; regenerating must be a no-op. Without this, a new module
      # can land while the skill still lists the old set — the trap that left the
      # intro of docs/modules.md at 18 modules while the registry had 29.
      - name: Skill references are up to date (CF-152)
        run: |
          go run ./cmd/gen-skill
          if ! git diff --quiet -- skills/; then
            echo "::error::skills/ is stale — run 'go run ./cmd/gen-skill' and commit the result"
            git diff -- skills/
            exit 1
          fi

  # Quality & security gate (CF-57, CF-72). Both are hard gates now: govulncheck
  # fails only on vulnerabilities the code actually reaches (kept clean by staying
  # on `stable` Go), and golangci-lint fails on any finding (the tree is clean;
  # config in .golangci.yml, schema v2). golangci-lint must stay on a release built
  # with Go >= the go.mod version, or it refuses to load the config — that's why
  # we're on v2: v1 is EOL and its last binaries are built with go1.24.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: govulncheck (gate)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: golangci-lint (gate)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

# Releases (cross-platform archives, checksums, Homebrew formula) are built by
# .github/workflows/release.yml with goreleaser on v* tags.
