<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="checkfleet logo">
  <defs>
    <linearGradient id="cf-bg" x1="64" y1="24" x2="448" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17274a"/>
      <stop offset="0.55" stop-color="#0e1830"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <radialGradient id="cf-glow" cx="256" cy="296" r="215" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cf-rim" x1="256" y1="8" x2="256" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cf-arc" x1="120" y1="140" x2="300" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="cf-check" x1="150" y1="360" x2="392" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="0.55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- app-icon plate: dark slate with an emerald ambient glow + top rim light -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#cf-bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#cf-glow)"/>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#cf-rim)"/>
  <rect x="8.75" y="8.75" width="494.5" height="494.5" rx="115.25" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>

  <!-- the 'c': an open arc that cradles the check -->
  <path d="M330 150 A150 150 0 1 0 330 362"
        fill="none" stroke="url(#cf-arc)" stroke-width="36" stroke-linecap="round"/>

  <!-- the check: bold emerald hero mark, crisp edges, drawn cleanly over the arc -->
  <path d="M172 266 L236 332 L366 164"
        fill="none" stroke="url(#cf-check)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
