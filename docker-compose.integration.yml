# checkfleet — integration stack (CF-37).
#
# Brings up real services so the opt-in integration suite (build tag
# `integration`) and the `checkfleet check all` smoke run can exercise the
# modules against them. This is NEVER used by `go test ./...` (unit tests use
# in-test servers and must stay offline).
#
#   docker compose -f docker-compose.integration.yml up -d --wait
#   go test -tags integration ./test/integration/...
#   docker compose -f docker-compose.integration.yml down -v
#
# Every service publishes on 127.0.0.1 with the ports checkfleet.integration.yml
# expects. Healthchecks + `--wait` make readiness deterministic in CI.
name: checkfleet-integration

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    # Standalone JetStream. NOTE: a single node has no meta raft group, so the
    # `nats` module correctly reports BAD "no meta-leader" — expected here, and
    # exit-code-neutral (the smoke run doesn't pass --exit-on-bad). A clean
    # meta-cluster would need ≥3 nodes; that's out of scope for the smoke stack.
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  consul:
    image: hashicorp/consul:1.19
    command: ["agent", "-dev", "-client=0.0.0.0"]
    ports:
      - "127.0.0.1:8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 3s
      timeout: 3s
      retries: 20

  haproxy:
    image: haproxy:2.9-alpine
    volumes:
      - ./deploy/integration/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:8404:8404"
    healthcheck:
      # Force IPv4: haproxy `bind *:8404` listens on 0.0.0.0 only, but the
      # container's /etc/hosts also maps `localhost` to ::1. On runners where
      # busybox wget prefers IPv6 the check hits [::1]:8404 (no listener) and
      # fails forever. 127.0.0.1 matches the bind (and the module's target).
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8404/stats;csv"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    command:
      - /usr/local/bin/etcd
      - --name=node1
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=node1=http://etcd:2380
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 3s
      timeout: 3s
      retries: 20

  patroni:
    build: ./deploy/integration/patroni
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "127.0.0.1:8008:8008"
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8008/health"]
      interval: 5s
      timeout: 3s
      retries: 40

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    healthcheck:
      # The management port (9000) serves /health/ready on KC 25+.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 40

  # The three services below exist for CF-161: mysql, mongodb and kafka are the
  # modules whose connection layer is a vendored driver speaking a wire protocol
  # (go-sql-driver, mongo-driver, franz-go). A unit test cannot reach that
  # adapter without a real server, and hand-faking a wire protocol would be more
  # untested code than it covers — so it is covered here instead.
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: checkfleet
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmysql"]
      interval: 5s
      timeout: 3s
      retries: 40

  mongodb:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      # Standalone: replSetGetStatus fails, which the module reports as a
      # non-ERROR finding ("not a replica set") — reachability is what matters.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 40

  kafka:
    image: apache/kafka:3.8.0
    environment:
      # Single-node KRaft: no ZooKeeper, broker and controller in one process.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # Two data listeners on purpose. A Kafka client follows the *advertised*
      # address after bootstrap, so one address cannot serve both sides: HOST is
      # advertised as 127.0.0.1 for the suite running outside Docker, INTERNAL as
      # kafka:29092 for containers on the compose network (the seed below).
      # With only the HOST listener, the seed container would be redirected to
      # 127.0.0.1 — itself — and hang until the timeout.
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 40

  # A topic with a consumer group that has read part of it, so kadm.GroupLag has
  # something to measure (CF-172). Without this the Kafka adapter's lag path was
  # the one symbol CF-161 left at 0%: the coverage number went up, that code
  # path did not. Produces 10 messages and consumes 5, leaving a known lag.
  kafka-seed:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        B=kafka:29092
        K=/opt/kafka/bin
        $$K/kafka-topics.sh --bootstrap-server $$B --create --if-not-exists \
          --topic checkfleet-lag --partitions 1 --replication-factor 1
        seq 1 10 | $$K/kafka-console-producer.sh --bootstrap-server $$B --topic checkfleet-lag
        $$K/kafka-console-consumer.sh --bootstrap-server $$B --topic checkfleet-lag \
          --group checkfleet-consumers --from-beginning --max-messages 5 --timeout-ms 15000 || true
        echo "seeded: topic checkfleet-lag, group checkfleet-consumers, lag 5"
