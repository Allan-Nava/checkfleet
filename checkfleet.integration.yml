# Config for the integration stack (docker-compose.integration.yml).
# Targets the services on 127.0.0.1. Used by the `check all` smoke run and as a
# reference by the integration suite. Never point this at real infrastructure.
timeout_seconds: 20

checks:
  redis:
    port: 6379
    targets:
      - 127.0.0.1

  nats:
    port: 8222
    scheme: http
    targets:
      - 127.0.0.1

  consul:
    port: 8500
    scheme: http
    expect_peers: 1          # -dev mode is a single-node cluster
    targets:
      - 127.0.0.1

  haproxy:
    port: 8404
    scheme: http
    path: /stats;csv
    targets:
      - 127.0.0.1

  postgres:
    targets:
      - name: pg-integration
        # Connects as the least-privilege user, not as the superuser (CF-181):
        # the suite must prove the published grants are enough.
        dsn: "host=127.0.0.1 port=5432 user=checkfleet dbname=postgres sslmode=disable"
        password_env: CF_PG_PASSWORD

  patroni:
    port: 8008
    scheme: http
    targets:
      - 127.0.0.1

  keycloak:
    base_url: http://127.0.0.1:8080
    health_url: http://127.0.0.1:9000/health/ready
    realms:
      - master

  # The three driver-backed modules (CF-161). Their connection layer is a
  # vendored wire-protocol driver, only reachable with a real server.
  mysql:
    targets:
      - name: mysql-integration
        dsn: "checkfleet:checkfleet@tcp(127.0.0.1:3306)/"

  mongodb:
    targets:
      - name: mongo-integration
        uri: mongodb://127.0.0.1:27017
        username: checkfleet
        password_env: CF_MONGO_PASSWORD
        auth_source: admin

  kafka:
    brokers:
      - 127.0.0.1:9092
    expect_brokers: 1        # single-node KRaft
    # Seeded by the kafka-seed service (CF-172): 10 produced, 5 consumed, so the
    # group carries a known lag and kadm.GroupLag actually runs.
    groups:
      - checkfleet-consumers
    lag_warn: 100
    lag_crit: 1000
